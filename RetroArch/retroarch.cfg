# RetroArch Master Configuration for TrimUI Smart Pro (Lumen-OS)
# Target: 1280x720 16:9 IPS Panel, Allwinner A133plus SoC

# === Video Settings ===
video_driver = "gl"
video_context_driver = ""
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_fullscreen_x = "1280"
video_fullscreen_y = "720"
video_windowed_position_width = "1280"
video_windowed_position_height = "720"
video_vsync = "true"
video_threaded = "true"
video_refresh_rate = "60.000000"
video_scale_integer = "true"
video_smooth = "false"
video_aspect_ratio_auto = "false"
video_aspect_ratio = "1.333300"
video_crop_overscan = "false"
video_max_swapchain_images = "3"
video_font_enable = "true"
video_font_size = "28.000000"
video_gpu_screenshot = "true"

# === Audio Settings ===
audio_driver = "oss"
audio_enable = "true"
audio_sync = "true"
audio_out_rate = "48000"
audio_latency = "64"
audio_resampler = "CC"
audio_resampler_quality = "1"
audio_volume = "0.000000"

# === Directory Isolation (Zero NAND Mutation) ===
system_directory = "/mnt/SDCARD/BIOS"
rgui_browser_directory = "/mnt/SDCARD/Roms"
screenshot_directory = "/mnt/SDCARD/Pictures/screenshots"
savefile_directory = "/mnt/SDCARD/RetroArch/.retroarch/saves"
savestate_directory = "/mnt/SDCARD/RetroArch/.retroarch/states"
video_shader_dir = "/mnt/SDCARD/RetroArch/.retroarch/shaders"
overlay_directory = "/mnt/SDCARD/RetroArch/.retroarch/overlay"
assets_directory = "/mnt/SDCARD/RetroArch/.retroarch/assets"
cheat_database_path = "/mnt/SDCARD/RetroArch/.retroarch/cheats"
core_options_path = "/mnt/SDCARD/RetroArch/.retroarch/retroarch-core-options.cfg"
thumbnails_directory = "/mnt/SDCARD/RetroArch/.retroarch/thumbnails"
playlist_directory = "/mnt/SDCARD/RetroArch/.retroarch/playlists"

# === Save & State Behavior ===
savestate_auto_save = "false"
savestate_auto_load = "false"
savestate_thumbnail_enable = "true"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"
sort_screenshots_by_content_enable = "true"
savestate_file_compression = "true"

# === Input Driver & Controller Mapping (TrimUI Smart Pro) ===
input_driver = "sdl2"
input_joypad_driver = "sdl2"
input_player1_joypad_index = "0"
input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_y_btn = "2"
input_player1_x_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_select = "rshift"
input_player1_start = "enter"
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_analog_dpad_mode = "1"

# === Safe Hotkey Bindings (Dedicated MENU Button / SELECT) ===
# Button 10 corresponds to physical MENU button (or SELECT = button 8)
input_enable_hotkey_btn = "10"
input_menu_toggle_btn = "3"          # MENU + X: Quick Menu
input_exit_emulator_btn = "7"        # MENU + START: Clean Quit
input_save_state_btn = "1"           # MENU + A: Save State
input_load_state_btn = "0"           # MENU + B: Load State
input_undo_load_state_btn = "2"      # MENU + Y: Undo Accidental Load State
input_toggle_fast_forward_btn = "5"  # MENU + R1: Fast Forward Toggle
input_rewind_btn = "4"               # MENU + L1: Rewind
input_state_slot_increase_btn = "14" # MENU + D-Pad Right: Save Slot +1
input_state_slot_decrease_btn = "13" # MENU + D-Pad Left: Save Slot -1

# === RetroAchievements Integration ===
cheevos_enable = "false"
cheevos_username = ""
cheevos_password = ""
cheevos_token = ""
cheevos_hardcore_mode_enable = "false"
cheevos_leaderboards_enable = "true"
cheevos_badges_enable = "true"
cheevos_start_active = "true"
cheevos_verbose_enable = "true"
cheevos_auto_screenshot = "false"
cheevos_richpresence_enable = "true"

# === System & UI Preferences ===
menu_driver = "ozone"
ozone_menu_color_theme = "1"
ui_companion_enable = "false"
check_firmware_before_loading = "false"
notification_show_screenshot = "true"
pause_nonactive = "true"
stdin_cmd_enable = "true"
auto_overrides_enable = "true"
auto_remaps_enable = "true"

# Lumen-OS Avahi mDNS Configuration
# Configured for standalone operation without D-Bus on TrimUI Linux

[server]
host-name=trimui
domain-name=local
use-ipv4=yes
use-ipv6=no
enable-dbus=no
check-response-ttl=no
use-iff-running=yes

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
enable-reflector=no

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=768
rlimit-stack=4194304
rlimit-nproc=3

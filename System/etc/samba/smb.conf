# Lumen-OS Optimized Samba Configuration
# Zero NAND Mutation Invariant: all ephemeral locks, state, and logs reside in RAM (/tmp/lumen/samba)
# Sandboxed exclusively to MicroSD card paths (/mnt/SDCARD)

[global]
   netbios name = TRIMUI
   workgroup = WORKGROUP
   server string = Lumen-OS Handheld
   security = user
   map to guest = Bad User
   guest account = root
   dns proxy = no

   # Memory and process tuning for Allwinner A133plus (1GB RAM)
   max smbd processes = 2
   disable netbios = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   deadtime = 15

   # Ephemeral RAM paths (Strict Zero NAND writes)
   lock directory = /tmp/lumen/samba/locks
   state directory = /tmp/lumen/samba/state
   cache directory = /tmp/lumen/samba/cache
   pid directory = /tmp/lumen/run
   private dir = /tmp/lumen/samba/private
   log file = /tmp/lumen/samba/log.%m
   max log size = 50

   # Low-latency networking
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=65536 SO_SNDBUF=65536
   read raw = yes
   write raw = yes
   max xmit = 65535

   # Airtight Sandboxing (prevent traversing outside /mnt/SDCARD into NAND rootfs)
   unix extensions = no
   wide links = no
   follow symlinks = no

[SDCARD]
   comment = TrimUI MicroSD Storage Root
   path = /mnt/SDCARD
   read only = no
   writeable = yes
   guest ok = yes
   browseable = yes
   create mask = 0777
   directory mask = 0777
   force user = root
   veto files = /._*/.DS_Store/
   delete veto files = yes

[Roms]
   comment = Handheld ROM Libraries
   path = /mnt/SDCARD/Roms
   read only = no
   writeable = yes
   guest ok = yes
   browseable = yes
   create mask = 0777
   directory mask = 0777
   force user = root
   veto files = /._*/.DS_Store/
   delete veto files = yes

# Lumen-OS Hotkey Configuration (triggerhappy thd)
# TrimUI Smart Pro Hardware Mapping:
#   Primary Gamepad: /dev/input/event3
#   Buttons: A=305 (BTN_EAST), B=304 (BTN_SOUTH), X=308 (BTN_NORTH), Y=307 (BTN_WEST)
#   L=310 (BTN_TL), R=311 (BTN_TR)
#   SELECT=314 (BTN_SELECT), START=315 (BTN_START), MENU=316 (BTN_MODE)
#   L2=ABS_Z (0-255), R2=ABS_RZ (0-255)
#   VOL_UP=115 (KEY_VOLUMEUP), VOL_DOWN=114 (KEY_VOLUMEDOWN)

# 1. Activities / Task Switcher (SELECT + MENU)
# Note: BTN_START+BTN_SELECT removed to avoid arcade Coin+Start kills
BTN_SELECT+BTN_MODE 1 /mnt/SDCARD/Apps/Activities/fastlaunch.sh
BTN_MODE+BTN_SELECT 1 /mnt/SDCARD/Apps/Activities/fastlaunch.sh

# 2. Instant Screenshot (SELECT + R2)
ABS_RZ+BTN_SELECT 255 /mnt/SDCARD/System/bin/screenshot.sh
BTN_SELECT+ABS_RZ 255 /mnt/SDCARD/System/bin/screenshot.sh

# 3. Night Mode / Warmth Toggle (SELECT + L2)
ABS_Z+BTN_SELECT 255 /mnt/SDCARD/System/bin/next-hw display --warmth toggle
BTN_SELECT+ABS_Z 255 /mnt/SDCARD/System/bin/next-hw display --warmth toggle

# 4. Hardware Display Brightness (MENU + Volume)
BTN_MODE+KEY_VOLUMEUP 1 /mnt/SDCARD/System/bin/next-hw display --brightness +10
BTN_MODE+KEY_VOLUMEUP 2 /mnt/SDCARD/System/bin/next-hw display --brightness +10
BTN_MODE+KEY_VOLUMEDOWN 1 /mnt/SDCARD/System/bin/next-hw display --brightness -10
BTN_MODE+KEY_VOLUMEDOWN 2 /mnt/SDCARD/System/bin/next-hw display --brightness -10
